<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brigadeiros Lucrativos</title>
    <!-- Ignore third-party cross-origin script errors that carry no debug details -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || e.message === 'Script error') {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message === 'Script error.' || e.reason.message === 'Script error')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
    <!-- Preconnect to Vimeo for ultra-fast player loading -->
    <link rel="preconnect" href="https://player.vimeo.com" crossorigin />
    <link rel="preconnect" href="https://f.vimeocdn.com" crossorigin />
    <link rel="preconnect" href="https://i.vimeocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://player.vimeo.com" />
    <link rel="dns-prefetch" href="https://f.vimeocdn.com" />
    <link rel="dns-prefetch" href="https://i.vimeocdn.com" />
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>
  </head>
